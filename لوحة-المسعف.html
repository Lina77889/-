<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>اسعفني — لوحة المسعف</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap');

  :root{
    --font:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
    --font-mono:'JetBrains Mono','SF Mono',Consolas,monospace;
    --b1:#2557C7;--b2:#15316E;--b3:#081227;
    --red:#DC1B30;--red2:#F0454F;
    --accent:#3E8EF7;--accent2:#6FB1FF;
    --warn:#F0A63E;--warn2:#FFC876;--warnbg:rgba(240,166,62,.12);
    --text:#FFFFFF;--muted:rgba(255,255,255,.68);--line:rgba(140,180,255,.14);
    --card:rgba(255,255,255,.06);--chip:rgba(8,20,45,.9);
    --input:rgba(0,0,0,.24);--ph:rgba(255,255,255,.38);
    --ok:#3DDC84;--okbg:rgba(61,220,132,.12);
    --ai:#9B7BFF;--aibg:rgba(155,123,255,.12);
    --shadow:0 18px 44px rgba(4,10,25,.5);
    --glow2:0 16px 36px rgba(37,87,199,.4);
  }
  :root[data-theme="light"]{
    --b1:#FFFFFF;--b2:#EAF1FC;--b3:#D3E3F8;
    --text:#142A52;--muted:#55698A;--line:rgba(20,70,140,.14);
    --card:rgba(255,255,255,.9);--chip:rgba(255,255,255,.95);
    --input:#FFFFFF;--ph:rgba(20,42,82,.38);
    --ok:#0E9C58;--okbg:rgba(14,156,88,.12);
    --warnbg:rgba(240,166,62,.16);
    --aibg:rgba(155,123,255,.12);
    --shadow:0 18px 40px rgba(40,80,150,.14);
    --glow2:0 16px 32px rgba(37,87,199,.26);
    --accent:#2F6FE0;--accent2:#5B93F2;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:var(--font);color:var(--text);
    background:radial-gradient(130% 90% at 15% 0%,var(--b1),var(--b2) 55%,var(--b3));
    min-height:100%;
  }
  .ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;}
  .ic-fill{fill:currentColor;stroke:none;}
  button,input,textarea{font-family:inherit;}
  button{cursor:pointer;}

  /* header */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 22px;border-bottom:1px solid var(--line);
    background:var(--chip);backdrop-filter:blur(10px);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(160deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#fff;flex:none;}
  .brand h1{font-size:16px;font-weight:800;}
  .brand .tag{font-size:11px;color:var(--muted);font-weight:600;}
  .duty{display:flex;align-items:center;gap:14px;}
  .duty-card{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;background:var(--card);border:1px solid var(--line);padding:8px 13px;border-radius:12px;}
  .dot-live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--okbg);display:inline-block;flex:none;}
  .icon-btn{width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:17px;}

  /* dashboard grid */
  .dash{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px 22px 30px;align-items:start;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}
  .panel-head{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;}
  .panel-head h2{font-size:13.5px;font-weight:800;display:flex;align-items:center;gap:7px;}
  .panel-head h2 .bar{width:4px;height:15px;border-radius:2px;background:var(--accent);display:inline-block;}
  .count-pill{font-size:11px;font-weight:800;background:var(--accent);color:#fff;padding:2px 9px;border-radius:99px;}

  /* queue */
  .filters{display:flex;gap:7px;padding:0 16px 10px;flex-wrap:wrap;}
  .filter-chip{font-size:11px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--input);border:1px solid var(--line);color:var(--muted);}
  .filter-chip.active{background:rgba(62,142,247,.18);border-color:var(--accent);color:var(--accent2);}
  .queue-list{display:flex;flex-direction:column;gap:9px;padding:0 12px 14px;max-height:calc(100vh - 190px);overflow-y:auto;}
  .qcard{
    text-align:right;padding:12px 13px;border-radius:13px;
    background:var(--input);border:2px solid transparent;
    display:flex;flex-direction:column;gap:6px;transition:.12s;
  }
  .qcard:active{transform:scale(.98);}
  .qcard.sel{border-color:var(--accent);background:rgba(62,142,247,.1);}
  .qcard .qtop{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .qcard .qname{font-size:13px;font-weight:800;}
  .qcard .qage{font-size:10.5px;color:var(--muted);font-weight:700;}
  .pill{font-size:10px;font-weight:800;padding:3px 9px;border-radius:99px;flex:none;white-space:nowrap;}
  .pill.crit{background:rgba(220,27,48,.16);color:#FF6B76;border:1px solid rgba(220,27,48,.35);}
  .pill.urgent{background:var(--warnbg);color:var(--warn2);border:1px solid rgba(240,166,62,.4);}
  .pill.stable{background:rgba(62,142,247,.14);color:var(--accent2);border:1px solid rgba(62,142,247,.3);}
  .pill.status{background:var(--okbg);color:var(--ok);border:1px solid rgba(61,220,132,.35);}
  .qcard .qcond{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;}
  .qcard .qmeta{display:flex;align-items:center;gap:10px;font-size:10.5px;color:var(--muted);flex-wrap:wrap;}
  .qcard .qmeta span{display:flex;align-items:center;gap:4px;white-space:nowrap;}

  /* detail */
  .detail-grid{display:grid;grid-template-columns:1fr 360px;gap:16px;}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0;}

  .case-head{padding:18px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .case-id{display:flex;align-items:center;gap:12px;}
  .case-id .avatar{width:52px;height:52px;border-radius:14px;background:linear-gradient(160deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex:none;}
  .case-id .name{font-size:16.5px;font-weight:800;}
  .case-id .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .case-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .btn{border:none;border-radius:13px;padding:10px 16px;font-size:12.5px;font-weight:800;color:#fff;background:linear-gradient(160deg,var(--accent2),var(--accent));box-shadow:var(--glow2);display:flex;align-items:center;gap:7px;}
  .btn.ghost{background:var(--input);color:var(--text);box-shadow:none;border:1px solid var(--line);}
  .btn.call{background:linear-gradient(160deg,var(--ok),#1FA968);box-shadow:0 14px 30px rgba(61,220,132,.3);}
  .btn:disabled{opacity:.5;pointer-events:none;}

  .warn-banner{margin:0 18px 16px;padding:12px 14px;border-radius:12px;background:var(--warnbg);border:1px solid rgba(240,166,62,.4);color:var(--warn2);font-size:12px;font-weight:700;display:flex;align-items:flex-start;gap:9px;line-height:1.7;}
  .warn-banner .ic{flex:none;margin-top:2px;color:var(--warn);}
  .warn-banner b{color:var(--warn2);}

  .map-wrap{height:230px;margin:0 18px 16px;border-radius:13px;overflow:hidden;border:1px solid var(--line);position:relative;}
  #caseMap{height:100%;}
  .eta-row{position:absolute;bottom:9px;right:9px;left:9px;display:flex;gap:8px;}
  .eta-chip{flex:1;background:var(--chip);border:1px solid var(--line);border-radius:11px;padding:8px 11px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;backdrop-filter:blur(8px);}
  .eta-chip b{font-family:var(--font-mono);color:var(--accent2);font-size:12.5px;}
  .leaflet-control-attribution{display:none;}
  .leaflet-control-zoom a{background:var(--chip)!important;color:var(--text)!important;border-color:var(--line)!important;}

  .fields{padding:0 18px 4px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field{background:var(--input);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
  .field span{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-bottom:3px;}
  .field b{font-size:13.5px;font-weight:800;}
  .field b.mono{font-family:var(--font-mono);color:var(--accent2);}
  .field.wide{grid-column:1/-1;}
  .field.flag span{color:var(--warn2);}
  .field.flag{border-color:rgba(240,166,62,.4);background:var(--warnbg);}

  .desc-box{margin:14px 18px 18px;padding:13px 14px;border-radius:12px;background:var(--input);border:1px solid var(--line);}
  .desc-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
  .desc-tag{font-size:11px;font-weight:800;padding:6px 11px;border-radius:99px;background:rgba(62,142,247,.14);border:1px solid var(--accent);color:var(--accent2);display:flex;align-items:center;gap:5px;}
  .desc-text{font-size:12.5px;line-height:1.9;color:var(--text);}
  .desc-text .lbl{color:var(--muted);font-size:10.5px;font-weight:700;display:block;margin-bottom:4px;}

  /* AI + timeline column */
  .ai-card{padding:16px;}
  .ai-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin-bottom:12px;color:var(--ai);}
  .ai-title .badge{width:26px;height:26px;border-radius:8px;background:var(--aibg);display:flex;align-items:center;justify-content:center;color:var(--ai);}
  .ai-tips{display:flex;flex-direction:column;gap:8px;}
  .ai-tip{display:flex;gap:8px;font-size:12px;line-height:1.75;padding:9px 10px;border-radius:10px;background:var(--aibg);}
  .ai-tip .ic{flex:none;margin-top:2px;color:var(--ai);}
  .ai-note{margin-top:11px;font-size:10px;color:var(--muted);line-height:1.7;padding-top:10px;border-top:1px dashed var(--line);}

  /* voice dictation card */
  .mic-outer{position:relative;width:74px;height:74px;flex:none;}
  .mic-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(62,142,247,.35);animation:micpulse 1.8s infinite;}
  .mic-ring.r2{animation-delay:.55s;}
  .mic-outer.listening .mic-ring{border-color:rgba(220,27,48,.45);animation-duration:1s;}
  @keyframes micpulse{0%{transform:scale(.82);opacity:.9}100%{transform:scale(1.65);opacity:0}}
  .mic-btn{position:absolute;inset:8px;border-radius:50%;border:none;background:linear-gradient(160deg,var(--accent2),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--glow2);}
  .mic-btn .ic{width:26px;height:26px;}
  .mic-btn.listening{background:linear-gradient(160deg,#F0454F,#DC1B30);box-shadow:0 16px 36px rgba(220,27,48,.4);}
  .mic-wrap{display:flex;flex-direction:column;align-items:center;gap:9px;padding:6px 0 16px;}
  .mic-status{font-size:11px;font-weight:700;color:var(--muted);}
  .mic-status.listening{color:#FF6B76;}

  .extract-box{padding:12px 13px;border-radius:12px;background:var(--input);border:1px solid var(--line);}
  .extract-empty{font-size:11.5px;color:var(--muted);text-align:center;padding:6px 4px;line-height:1.8;}
  .extract-quote{font-size:11.5px;color:var(--muted);line-height:1.8;margin-bottom:10px;}
  .extract-quote b{color:var(--text);font-weight:700;}
  .extract-rows{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .extract-chip{background:var(--chip);border:1px solid var(--line);border-radius:9px;padding:7px 9px;}
  .extract-chip span{display:block;font-size:9.5px;color:var(--muted);font-weight:700;margin-bottom:2px;}
  .extract-chip b{font-family:var(--font-mono);font-size:12px;color:var(--accent2);}
  .extract-chip.proc b{font-family:var(--font);color:var(--ok);font-size:11.5px;}
  .extract-time{margin-top:9px;font-size:9.5px;color:var(--muted);text-align:left;font-family:var(--font-mono);}

  .voice-alert{margin-top:11px;padding:10px 12px;border-radius:11px;background:rgba(220,27,48,.14);border:1px solid rgba(220,27,48,.4);color:#FF8A92;font-size:11.5px;font-weight:700;line-height:1.7;display:flex;gap:8px;align-items:flex-start;}
  .voice-alert .ic{flex:none;color:#FF6B76;margin-top:1px;}

  /* SBAR handover card */
  .hosp-badge{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;background:var(--okbg);color:var(--ok);border:1px solid rgba(61,220,132,.35);padding:9px 11px;border-radius:11px;margin-bottom:13px;line-height:1.6;}
  .hosp-badge.sent{background:rgba(62,142,247,.14);color:var(--accent2);border-color:rgba(62,142,247,.35);}
  .hosp-badge .ic{flex:none;}
  .sbar-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:13px;}
  .sbar-row{display:flex;gap:10px;padding:9px 10px;border-radius:10px;background:var(--input);border:1px solid var(--line);}
  .sbar-row .sbar-k{flex:none;width:22px;height:22px;border-radius:7px;background:rgba(62,142,247,.16);color:var(--accent2);font-size:10.5px;font-weight:900;display:flex;align-items:center;justify-content:center;}
  .sbar-row .sbar-v{font-size:11.5px;line-height:1.7;}
  .sbar-row .sbar-v small{display:block;font-size:9.5px;color:var(--muted);font-weight:700;margin-bottom:2px;}
  .send-report-btn{width:100%;padding:13px;font-size:13px;justify-content:center;}
  .send-report-btn.sent{background:linear-gradient(160deg,var(--ok),#1FA968);box-shadow:0 14px 30px rgba(61,220,132,.3);}

  .timeline{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;}
  .tl-item{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:9px 11px;border-radius:10px;background:var(--input);}
  .tl-item .tl-t{color:var(--muted);font-family:var(--font-mono);font-size:10.5px;flex:none;}
  .tl-item .ic{color:var(--ok);flex:none;}

  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:80px 20px;color:var(--muted);text-align:center;}
  .empty-state .ic{width:44px;height:44px;opacity:.5;}
  .empty-state p{font-size:13px;max-width:280px;line-height:1.8;}

  .snack{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(140%);background:var(--chip);border:1px solid var(--line);color:var(--text);padding:12px 20px;border-radius:13px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow);transition:.25s;z-index:50;backdrop-filter:blur(8px);}
  .snack.show{transform:translateX(-50%) translateY(0);}

  @media(max-width:1080px){
    .dash{grid-template-columns:1fr;}
    .detail-grid{grid-template-columns:1fr;}
    .queue-list{max-height:340px;}
  }
</style>
</head>

const STATUS_FLOW=['جديد','تم القبول','في الطريق','وصل الموقع'];

const HOSPITAL_NAME='مستشفى الملك فهد (طوارئ الحوادث)';

const VOICE_SCRIPT={
  c1:{quote:'الضغط 150 على 95، النبض 130 وغير منتظم، أعطيته أسبرين وبدأت أكسجين بقناع',
      bpSys:150,bpDia:95,pulse:130,extra:[{label:'الإيقاع',value:'غير منتظم'}],

      procedures:[{label:'Oral Glucose',value:'Given'}]},
  c3:{quote:'الضغط 90 على 60، النبض 115، ركبت طوق عنقي وبدأت محلول ملحي',
      bpSys:90,bpDia:60,pulse:115,extra:[],
      procedures:[{label:'C-Collar',value:'Applied'},{label:'IV Saline',value:'500ml'}]},
  c4:{quote:'معدل التنفس 28 بالدقيقة، الأكسجين 91%، أعطيتها بخاخ سالبوتامول عبر نيبولايزر',
      bpSys:118,bpDia:76,pulse:118,extra:[{label:'RR',value:'28/min'},{label:'SpO2',value:'91%'}],
      procedures:[{label:'Salbutamol Neb',value:'Given'}]},
  c5:{quote:'العلامات الحيوية مستقرة، ثبّت الكاحل بجبيرة وكمادة ثلج',

};

let selectedCase=null,activeFilter='all',theme=localStorage.getItem('paramedic_theme')||'dark';
let caseMap=null,caseMarker=null,ambMarker=null,routeLine=null;
const caseTimelines={};
const voiceState={};
const handoverSent={};

function toast(msg){const s=document.getElementById('snack');s.textContent=msg;s.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>s.classList.remove('show'),2600);}

function toggleTheme(){theme=theme==='dark'?'light':'dark';localStorage.setItem('paramedic_theme',theme);applyTheme();}
function applyTheme(){document.documentElement.setAttribute('data-theme',theme);document.getElementById('themeToggle').innerHTML='<svg class="ic"><use href="#'+(theme==='dark'?'i-sun':'i-moon')+'"/></svg>';if(caseMap)setTimeout(()=>swapTiles(),50);}
function tileUrl(){return theme==='light'?'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png':'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';}
function swapTiles(){if(!caseMap)return;caseMap.eachLayer(l=>{if(l instanceof L.TileLayer)caseMap.removeLayer(l);});L.tileLayer(tileUrl(),{attribution:'© OSM © CARTO'}).addTo(caseMap);}

function haversine(a,b){
  const R=6371,toRad=d=>d*Math.PI/180;
  const dLat=toRad(b[0]-a[0]),dLon=toRad(b[1]-a[1]);
  const x=Math.sin(dLat/2)**2+Math.cos(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function renderFilters(){
  const f=document.getElementById('filters');
  const opts=[['all','الكل'],['crit','حرجة'],['urgent','عاجلة'],['stable','مستقرة']];
  f.innerHTML=opts.map(([k,l])=>`<button class="filter-chip ${activeFilter===k?'active':''}" onclick="setFilter('${k}')">${l}</button>`).join('');
}
function setFilter(k){activeFilter=k;renderFilters();renderQueue();}

function renderQueue(){
  const list=CASES.filter(c=>activeFilter==='all'||c.priority===activeFilter)
    .sort((a,b)=>PRIORITY_ORDER[a.priority]-PRIORITY_ORDER[b.priority]);
  document.getElementById('queueCount').textContent=CASES.length;
  const box=document.getElementById('queueList');
  box.innerHTML=list.map(c=>{
    const st=caseTimelines[c.id]?caseTimelines[c.id].status:c.status;
    const pillClass=c.priority==='crit'?'crit':c.priority==='urgent'?'urgent':'stable';
    const dist=haversine(AMBULANCE_POS,c.coords).toFixed(1);
    return `<button class="qcard ${selectedCase&&selectedCase.id===c.id?'sel':''}" onclick="selectCase('${c.id}')">
      <div class="qtop"><span class="qname">${c.name}</span><span class="pill ${pillClass}">${PRIORITY_LABEL[c.priority]}</span></div>
      <div class="qcond"><svg class="ic"><use href="#${CONDITIONS_ICO[c.conds[0]]||'i-alert'}"/></svg> ${c.conds.join(' + ')} <span class="qage">— ${c.age} سنة</span></div>
      <div class="qmeta"><span><svg class="ic"><use href="#i-signal"/></svg> ${dist} كم</span><span>${c.time}</span>${st!=='جديد'?`<span class="pill status">${st}</span>`:''}</div>
    </button>`;
  }).join('')||'<div class="empty-state" style="padding:40px 10px"><p>لا توجد بلاغات ضمن هذا التصنيف حالياً.</p></div>';
}

function selectCase(id){
  selectedCase=CASES.find(c=>c.id===id);
  if(!caseTimelines[id])caseTimelines[id]={status:'جديد',log:[{t:nowTime(),txt:'تم استلام البلاغ في اللوحة'}]};
  if(!voiceState[id])voiceState[id]={listening:false,entry:null,capturedAt:null};
  if(!(id in handoverSent))handoverSent[id]=false;
  renderQueue();
  renderDetail();
}

function nowTime(){return new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});}

function renderDetail(){
  const c=selectedCase,tl=caseTimelines[c.id];
  const dist=haversine(AMBULANCE_POS,c.coords);
  const eta=Math.max(2,Math.round(dist/40*60));
  const hasFlag=c.drugs.includes('مميّع')&&(c.conds.includes('نزيف')||c.conds.includes('إصابة رأس'));

  const nextStatus={ 'جديد':'تم القبول','تم القبول':'في الطريق','في الطريق':'وصل الموقع','وصل الموقع':null }[tl.status];
  const nextLabel={ 'تم القبول':'قبول البلاغ','في الطريق':'بدء التحرك','وصل الموقع':'تأكيد الوصول' }[nextStatus]||'';

  document.getElementById('mainArea').innerHTML=`
    <div class="panel case-head">
      <div class="case-id">
        <div class="avatar"><svg class="ic" style="width:24px;height:24px"><use href="#${c.kind==='family'?'i-users':'i-tap'}"/></svg></div>
        <div>
          <div class="name">${c.name} <span class="qage">— ${c.age} سنة</span></div>
          <div class="sub">${c.relation} · بلّغ: ${c.reporter}</div>
        </div>
      </div>
      <div class="case-acts">
        <span class="pill ${c.priority==='crit'?'crit':c.priority==='urgent'?'urgent':'stable'}">${PRIORITY_LABEL[c.priority]}</span>
        <span class="pill status">${tl.status}</span>
        <button class="btn call" onclick="callReporter()"><svg class="ic"><use href="#i-phone"/></svg> اتصال بالمبلّغ</button>
        ${nextStatus?`<button class="btn" onclick="advanceStatus()"><svg class="ic"><use href="#i-check-circle"/></svg> ${nextLabel}</button>`:''}
      </div>
    </div>

    ${hasFlag?`<div class="panel warn-banner"><svg class="ic"><use href="#i-alert"/></svg><span><b>تنبيه تعارض دوائي:</b> الحالة على مميّع دم مع وجود نزيف/إصابة رأس — تجنّب الضغط المباشر الشديد أو أي حقن عضلي، وراقب علامات نزيف داخلي.</span></div>`:''}

    <div class="detail-grid">
      <div class="col">
        <div class="panel">
          <div class="panel-head"><h2><span class="bar"></span> الموقع والوصول</h2></div>
          <div class="map-wrap">
            <div id="caseMap"></div>
            <div class="eta-row">
              <div class="eta-chip"><svg class="ic"><use href="#i-route"/></svg> المسافة <b>${dist.toFixed(1)} كم</b></div>
              <div class="eta-chip"><svg class="ic"><use href="#i-target"/></svg> الوصول خلال <b>${eta} دقيقة</b></div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h2><span class="bar"></span> السجل الطبي الكامل</h2></div>
          <div class="fields">
            <div class="field"><span>فصيلة الدم</span><b class="mono">${c.blood}</b></div>
            <div class="field"><span>العمر</span><b class="mono">${c.age} سنة</b></div>
            <div class="field ${c.allergy!=='لا يوجد'?'flag':''}"><span>الحساسية</span><b>${c.allergy}</b></div>
            <div class="field"><span>الأدوية الحالية</span><b>${c.drugs}</b></div>
            <div class="field wide"><span>الأمراض المزمنة</span><b>${c.chronic}</b></div>
            <div class="field wide"><span>آخر عملية</span><b>${c.ops}</b></div>
          </div>
          <div class="desc-box">
            <div class="desc-tags">${c.conds.map(t=>`<span class="desc-tag"><svg class="ic"><use href="#${CONDITIONS_ICO[t]||'i-alert'}"/></svg> ${t}</span>`).join('')}</div>
            <div class="desc-text"><span class="lbl">وصف الحالة من المبلّغ</span>${c.desc}</div>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="panel ai-card">
          <div class="ai-title"><span class="badge"><svg class="ic ic-fill"><use href="#i-spark"/></svg></span> المساعد الصوتي الميداني</div>
          <div class="mic-wrap">
            <div class="mic-outer" id="micOuter">
              <span class="mic-ring"></span><span class="mic-ring r2"></span>
              <button class="mic-btn" id="micBtn" onclick="toggleMic()"><svg class="ic"><use href="#i-mic"/></svg></button>
            </div>
            <div class="mic-status" id="micStatus">جاهز للاستماع — اضغطي للتدوين الصوتي</div>
          </div>
          <div class="extract-box" id="extractBox"></div>
          <div id="voiceAlertBox"></div>
          <div class="ai-note">تفريغ وتصنيف سريري فوري لكلام المسعف — محاكاة تجريبية، دعم قرار ولا تُغني عن التوثيق الرسمي.</div>
        </div>

        <div class="panel ai-card handover-card">
          <div class="ai-title"><span class="badge"><svg class="ic ic-fill"><use href="#i-spark"/></svg></span> تقرير التسليم المباشر — SBAR</div>
          <div class="hosp-badge" id="hospBadge"></div>
          <div class="sbar-rows" id="sbarRows"></div>
          <button class="btn send-report-btn" id="sendReportBtn" onclick="sendHandover()"><svg class="ic"><use href="#i-send"/></svg> إرسال التقرير الفوري لطوارئ المستشفى</button>
        </div>

        <div class="panel">
          <div class="panel-head"><h2><span class="bar"></span> سجل الحالة</h2></div>
          <div class="timeline" id="timeline"></div>
        </div>
      </div>
    </div>
  `;

  renderTimeline();
  renderVoiceCard();
  renderHandoverCard();
  initCaseMap();
}

function renderTimeline(){
  const tl=caseTimelines[selectedCase.id];
  document.getElementById('timeline').innerHTML=tl.log.slice().reverse().map(e=>
    `<div class="tl-item"><span><svg class="ic"><use href="#i-check-circle"/></svg> ${e.txt}</span><span class="tl-t">${e.t}</span></div>`
  ).join('');
}

function advanceStatus(){
  const c=selectedCase,tl=caseTimelines[c.id];
  const idx=STATUS_FLOW.indexOf(tl.status);
  if(idx<0||idx>=STATUS_FLOW.length-1)return;
  tl.status=STATUS_FLOW[idx+1];
  tl.log.push({t:nowTime(),txt:'الحالة الآن: '+tl.status});
  renderDetail();
}

function callReporter(){
  const btn=event.target.closest('button');
  const ic='<svg class="ic"><use href="#i-phone"/></svg> ';
  btn.innerHTML=ic+'جارٍ الاتصال…';
  setTimeout(()=>{btn.innerHTML=ic+'متصل الآن'; },700);
  setTimeout(()=>{btn.innerHTML=ic+'اتصال بالمبلّغ';},2600);
}

function toggleMic(){
  const c=selectedCase,st=voiceState[c.id];
  if(st.listening)return;
  st.listening=true;
  document.getElementById('micOuter').classList.add('listening');
  document.getElementById('micBtn').classList.add('listening');
  document.getElementById('micStatus').textContent='تستمع الآن…';
  document.getElementById('micStatus').classList.add('listening');
  setTimeout(()=>captureVoice(c.id),1700);
}

function captureVoice(caseId){
  const st=voiceState[caseId];
  if(!st||selectedCase.id!==caseId)return; // user switched cases mid-capture
  const script=VOICE_SCRIPT[caseId];
  st.listening=false;
  st.entry=script;
  st.capturedAt=nowTime();
  caseTimelines[caseId].log.push({t:nowTime(),txt:'تدوين صوتي: علامات حيوية وإجراء ميداني'});
  toast('تم تدوين الملاحظة السريرية صوتياً');
  renderVoiceCard();
  renderHandoverCard();
  renderTimeline();
}

function renderVoiceCard(){
  const c=selectedCase,st=voiceState[c.id];
  document.getElementById('micOuter').classList.toggle('listening',st.listening);
  document.getElementById('micBtn').classList.toggle('listening',st.listening);
  const statusEl=document.getElementById('micStatus');
  statusEl.classList.toggle('listening',st.listening);
  statusEl.textContent=st.listening?'تستمع الآن…':'جاهز للاستماع — اضغطي للتدوين الصوتي';

  const box=document.getElementById('extractBox');
  if(!st.entry){
    box.innerHTML='<div class="extract-empty">لا يوجد تدوين صوتي بعد لهذه الحالة — اضغطي زر المايكروفون وابدئي بوصف العلامات الحيوية والإجراء بصوتك.</div>';
  }else{
    const e=st.entry;
    const vitalChips=[`<div class="extract-chip"><span>الضغط</span><b>${e.bpSys}/${e.bpDia} mmHg</b></div>`,`<div class="extract-chip"><span>النبض</span><b>${e.pulse} bpm</b></div>`]
      .concat((e.extra||[]).map(x=>`<div class="extract-chip"><span>${x.label}</span><b>${x.value}</b></div>`))
      .concat((e.procedures||[]).map(x=>`<div class="extract-chip proc"><span>الإجراء الميداني</span><b>${x.label} ${x.value?'— '+x.value:''}</b></div>`));
    box.innerHTML=`
      <div class="extract-quote"><svg class="ic"><use href="#i-mic"/></svg> آخر ما نُطق: «<b>${e.quote}</b>»</div>
      <div class="extract-rows">${vitalChips.join('')}</div>
      <div class="extract-time">آخر تحديث: ${st.capturedAt}</div>`;
  }

  const alertBox=document.getElementById('voiceAlertBox');
  const e=st.entry;
  if(e&&e.bpSys<100&&c.drugs.includes('مميّع')&&(c.conds.includes('نزيف')||c.conds.includes('إصابة رأس'))){
    alertBox.innerHTML=`<div class="voice-alert"><svg class="ic"><use href="#i-alert"/></svg><span>مؤشر خطر: اشتباه صدمة نزفية تماشياً مع إصابة الرأس ومميّع الدم.</span></div>`;
  }else{
    alertBox.innerHTML='';
  }
}

function renderHandoverCard(){
  const c=selectedCase,st=voiceState[c.id],sent=handoverSent[c.id];
  const eta=HOSPITAL_ETA[c.id]||5;
  document.getElementById('hospBadge').className='hosp-badge'+(sent?' sent':'');
  document.getElementById('hospBadge').innerHTML=`<svg class="ic"><use href="#${sent?'i-check-circle':'i-route'}"/></svg> ${HOSPITAL_NAME} — ${sent?'تم استلام التقرير، بانتظار وصولكم':'بانتظار الحالة'} (ETA: ${eta} دقائق)`;

  const e=st.entry;
  const vitalsLine=e?`الضغط ${e.bpSys}/${e.bpDia} — النبض ${e.pulse}${(e.extra||[]).map(x=>' — '+x.label+' '+x.value).join('')}`:'بانتظار تدوين العلامات الحيوية صوتيًا';
  const procLine=e&&e.procedures&&e.procedures.length?e.procedures.map(x=>x.label+(x.value?' '+x.value:'')).join(' + '):'لا يوجد إجراء مسجّل بعد';

  document.getElementById('sbarRows').innerHTML=`
    <div class="sbar-row"><span class="sbar-k">S</span><div class="sbar-v"><small>الوضع الحالي</small>${c.name} — ${c.age} سنة — ${PRIORITY_LABEL[c.priority]} — ${c.conds.join(' + ')}</div></div>
    <div class="sbar-row"><span class="sbar-k">B</span><div class="sbar-v"><small>الخلفية الطبية</small>مزمن: ${c.chronic} — أدوية: ${c.drugs} — حساسية: ${c.allergy}</div></div>
    <div class="sbar-row"><span class="sbar-k">A</span><div class="sbar-v"><small>التقييم والعلامات الحيوية</small>${vitalsLine}</div></div>
    <div class="sbar-row"><span class="sbar-k">R</span><div class="sbar-v"><small>الإجراء والتوصية</small>${procLine} — التوجه المباشر إلى ${HOSPITAL_NAME}</div></div>`;

  const btn=document.getElementById('sendReportBtn');
  btn.classList.toggle('sent',!!sent);
  btn.innerHTML=sent?'<svg class="ic"><use href="#i-check-circle"/></svg> تم إرسال التقرير':'<svg class="ic"><use href="#i-send"/></svg> إرسال التقرير الفوري لطوارئ المستشفى';
}

function sendHandover(){
  const c=selectedCase;
  if(handoverSent[c.id])return;
  const btn=document.getElementById('sendReportBtn');
  btn.disabled=true;
  btn.innerHTML='<svg class="ic"><use href="#i-send"/></svg> جارٍ الإرسال…';
  setTimeout(()=>{
    handoverSent[c.id]=true;
    caseTimelines[c.id].log.push({t:nowTime(),txt:'تم إرسال تقرير SBAR إلى '+HOSPITAL_NAME});
    toast('تم إرسال التقرير الفوري لطوارئ المستشفى');
    btn.disabled=false;
    renderHandoverCard();
    renderTimeline();
  },900);
}

const pinIconCase=L.divIcon({className:'pin',html:'<div style="width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:linear-gradient(160deg,#F0454F,#DC1B30);border:3px solid #fff;box-shadow:0 4px 10px rgba(220,27,48,.4)"></div>',iconSize:[26,26],iconAnchor:[13,24]});
const pinIconAmb=L.divIcon({className:'pin',html:'<div style="width:24px;height:24px;border-radius:50%;background:linear-gradient(160deg,#6FB1FF,#3E8EF7);border:3px solid #fff;box-shadow:0 4px 10px rgba(62,142,247,.4)"></div>',iconSize:[24,24],iconAnchor:[12,12]});

function initCaseMap(){
  const c=selectedCase;
  if(caseMap){caseMap.remove();caseMap=null;}
  caseMap=L.map('caseMap',{zoomControl:false,attributionControl:false}).setView(c.coords,13);
  L.tileLayer(tileUrl(),{attribution:'© OSM © CARTO'}).addTo(caseMap);
  caseMarker=L.marker(c.coords,{icon:pinIconCase}).addTo(caseMap);
  ambMarker=L.marker(AMBULANCE_POS,{icon:pinIconAmb}).addTo(caseMap);
  routeLine=L.polyline([AMBULANCE_POS,c.coords],{color:'#3E8EF7',weight:3,opacity:.75,dashArray:'2 8'}).addTo(caseMap);
  caseMap.fitBounds(routeLine.getBounds(),{padding:[26,26]});
}

window.addEventListener('load',()=>{
  applyTheme();
  renderFilters();
  renderQueue();
});
</script>
</body>
</html>
