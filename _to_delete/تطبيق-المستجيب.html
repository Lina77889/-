<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>اسعفني — تطبيق المستجيب</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap');

  :root{
    --font:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
    --font-mono:'JetBrains Mono','SF Mono',Consolas,monospace;
    --b1:#2557C7;--b2:#15316E;--b3:#081227;
    --red:#DC1B30;--red2:#F0454F;
    --accent:#3E8EF7;--accent2:#6FB1FF;
    --text:#FFFFFF;--muted:rgba(255,255,255,.68);--line:rgba(140,180,255,.14);
    --card:rgba(255,255,255,.06);--chip:rgba(8,20,45,.9);
    --input:rgba(0,0,0,.24);--ph:rgba(255,255,255,.38);
    --ok:#3DDC84;--okbg:rgba(61,220,132,.12);
    --shadow:0 18px 44px rgba(4,10,25,.5);
    --glow2:0 16px 36px rgba(37,87,199,.4);
  }
  :root[data-theme="light"]{
    --b1:#FFFFFF;--b2:#EAF1FC;--b3:#D3E3F8;
    --text:#142A52;--muted:#55698A;--line:rgba(20,70,140,.14);
    --card:rgba(255,255,255,.9);--chip:rgba(255,255,255,.95);
    --input:#FFFFFF;--ph:rgba(20,42,82,.38);
    --ok:#0E9C58;--okbg:rgba(14,156,88,.12);
    --shadow:0 18px 40px rgba(40,80,150,.14);
    --glow2:0 16px 32px rgba(37,87,199,.26);
    --accent:#2F6FE0;--accent2:#5B93F2;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:var(--font);color:var(--text);
    background:radial-gradient(130% 90% at 15% 0%,var(--b1),var(--b2) 55%,var(--b3));
    min-height:100%;display:flex;justify-content:center;padding:18px 14px 40px;
  }
  .ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;}
  button{cursor:pointer;font-family:inherit;}

  .app{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--chip);border:1px solid var(--line);border-radius:15px;padding:12px 14px;backdrop-filter:blur(10px);}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(160deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff;flex:none;}
  .brand h1{font-size:14px;font-weight:800;}
  .brand .tag{font-size:10.5px;color:var(--muted);font-weight:600;}
  .icon-btn{width:34px;height:34px;border-radius:10px;background:var(--input);border:1px solid var(--line);color:var(--text);display:flex;align-items:center;justify-content:center;flex:none;}

  .profile-chip{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 14px;box-shadow:var(--shadow);}
  .profile-chip .av{width:38px;height:38px;border-radius:11px;background:linear-gradient(160deg,var(--accent2),var(--accent));display:flex;align-items:center;justify-content:center;color:#fff;flex:none;}
  .profile-chip .nm{font-size:13px;font-weight:800;}
  .profile-chip .lv{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:1px;}
  .profile-chip .status{margin-right:auto;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ok);}
  .dot-live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--okbg);flex:none;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;}
  .panel h2{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .panel h2 .bar{width:4px;height:15px;border-radius:2px;background:var(--red);display:inline-block;}

  .alert-pulse{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 16px;}
  .alert-outer{position:relative;width:70px;height:70px;}
  .alert-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(220,27,48,.4);animation:apulse 1.6s infinite;}
  .alert-ring.r2{animation-delay:.5s;}
  @keyframes apulse{0%{transform:scale(.82);opacity:.9}100%{transform:scale(1.7);opacity:0}}
  .alert-icon{position:absolute;inset:7px;border-radius:50%;background:linear-gradient(160deg,var(--red2),var(--red));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 16px 34px rgba(220,27,48,.4);}
  .alert-icon .ic{width:26px;height:26px;}
  .alert-title{font-size:13.5px;font-weight:800;color:#FF8A92;}

  .case-mini{background:var(--input);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:13px;}
  .case-mini .nm{font-size:14.5px;font-weight:800;margin-bottom:2px;}
  .case-mini .sub{font-size:11px;color:var(--muted);margin-bottom:10px;}
  .case-mini .tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px;}
  .tag{font-size:11px;font-weight:800;padding:6px 11px;border-radius:99px;background:rgba(220,27,48,.14);border:1px solid rgba(220,27,48,.35);color:#FF8A92;display:flex;align-items:center;gap:5px;}
  .case-mini .desc{font-size:12px;line-height:1.8;color:var(--text);margin-bottom:12px;}
  .mini-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .mini-field{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 9px;text-align:center;}
  .mini-field span{display:block;font-size:9.5px;color:var(--muted);font-weight:700;margin-bottom:2px;}
  .mini-field b{font-family:var(--font-mono);font-size:13px;color:var(--accent2);}
  .privacy-note{margin-top:11px;font-size:10px;color:var(--muted);line-height:1.7;display:flex;gap:6px;align-items:flex-start;}
  .privacy-note .ic{flex:none;margin-top:1px;}

  .btn{width:100%;border:none;border-radius:14px;padding:14px;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(160deg,var(--accent2),var(--accent));box-shadow:var(--glow2);display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn.accept{background:linear-gradient(160deg,var(--red2),var(--red));box-shadow:0 16px 34px rgba(220,27,48,.35);}
  .btn:disabled{opacity:.55;pointer-events:none;}
  .btn.done{background:linear-gradient(160deg,var(--ok),#1FA968);box-shadow:0 14px 30px rgba(61,220,132,.3);}

  .action-list{display:flex;flex-direction:column;gap:9px;}
  .action-btn{width:100%;text-align:right;display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:13px;background:var(--input);border:1px solid var(--line);color:var(--text);font-size:12.5px;font-weight:800;}
  .action-btn .ic-wrap{width:32px;height:32px;border-radius:9px;background:rgba(62,142,247,.14);color:var(--accent2);display:flex;align-items:center;justify-content:center;flex:none;}
  .action-btn.logged{border-color:rgba(61,220,132,.4);background:var(--okbg);color:var(--ok);}
  .action-btn.logged .ic-wrap{background:rgba(61,220,132,.16);color:var(--ok);}
  .action-btn:disabled{opacity:.7;}

  .log-list{display:flex;flex-direction:column;gap:8px;margin-top:13px;}
  .log-item{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;padding:9px 11px;border-radius:10px;background:var(--okbg);color:var(--ok);border:1px solid rgba(61,220,132,.3);}
  .log-item .lt{color:var(--muted);font-family:var(--font-mono);font-size:10.5px;flex:none;}
  .log-empty{font-size:11.5px;color:var(--muted);text-align:center;padding:8px 4px;}

  .eta-row{display:flex;gap:8px;margin-top:13px;}
  .eta-chip{flex:1;background:var(--chip);border:1px solid var(--line);border-radius:11px;padding:9px 11px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .eta-chip b{font-family:var(--font-mono);color:var(--accent2);font-size:12.5px;}

  .snack{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(140%);background:var(--chip);border:1px solid var(--line);color:var(--text);padding:12px 20px;border-radius:13px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow);transition:.25s;z-index:50;backdrop-filter:blur(8px);max-width:90vw;text-align:center;}
  .snack.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<svg style="display:none">
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.3"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.2A8.3 8.3 0 1 1 9.8 4a6.6 6.6 0 0 0 10.2 10.2z"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M2.6 20c1.1-3.6 3.6-5.4 6.4-5.4s5.3 1.8 6.4 5.4"/><circle cx="17.3" cy="8.6" r="2.6"/><path d="M15.4 14.3c2.1.1 4 1.7 4.9 4.3"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5 22 20.5H2z"/><path d="M12 9.7v4.6"/><circle cx="12" cy="17" r=".15" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.5s6 6.7 6 11a6 6 0 1 1-12 0c0-4.3 6-11 6-11z"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 2.8v6.2c0 5-3.2 7.6-7.5 9-4.3-1.4-7.5-4-7.5-9V5.8z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M7.5 10.5V7.5a4.5 4.5 0 0 1 9 0v3"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-route" viewBox="0 0 24 24"><circle cx="5" cy="6" r="2.3"/><circle cx="19" cy="18" r="2.3"/><path d="M5 8.3v3.2a3 3 0 0 0 3 3h5a3 3 0 0 1 3 3v.5" stroke-dasharray="2.4 2.6"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.2s-7.6-4.6-9.7-9.4C.6 6.8 3 3.6 6.4 3.6c2 0 3.6 1.2 5.6 3.6 2-2.4 3.6-3.6 5.6-3.6 3.4 0 5.8 3.2 4.1 7.2C19.6 15.6 12 20.2 12 20.2z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></symbol>
  <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.3"/><path d="M8 12.3l2.7 2.7 5.3-5.6"/></symbol>
  <symbol id="i-wind" viewBox="0 0 24 24"><path d="M3 8.5h11a2.8 2.8 0 1 0-2.8-2.8"/><path d="M3 15.5h14.5a2.8 2.8 0 1 1-2.8 2.8"/><path d="M3 12h8"/></symbol>
</svg>

<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo">إس</div>
      <div><h1>شبكة المستجيبين — اسعفني</h1><div class="tag">تطبيق منفصل عن لوحة المسعف الرسمية</div></div>
    </div>
    <button class="icon-btn" id="themeToggle" onclick="toggleTheme()"><svg class="ic"><use href="#i-moon"/></svg></button>
  </div>

  <div class="profile-chip">
    <div class="av"><svg class="ic" style="width:18px;height:18px"><use href="#i-shield"/></svg></div>
    <div>
      <div class="nm">فيصل السبيعي</div>
      <div class="lv">مستجيب معتمد — إنعاش قلبي رئوي (CPR/AED)</div>
    </div>
    <div class="status"><span class="dot-live"></span> متاح الآن</div>
  </div>

  <div id="mainArea"></div>
</div>

<div class="snack" id="snack"></div>

<script src="asafni-store.js"></script>
<script>
const CASE_ID='c6';
const CASE={
  id:'c6',name:'ياسر سعيد القحطاني',age:47,
  coords:[21.5080,39.1780],
  blood:'O+',allergy:'لا يوجد',
  conds:['مغمى عليه'],
  desc:'انهار فجأة أثناء اجتماع عمل، فاقد الوعي ولا يستجيب، النبض غير واضح للمبلّغ.'
};
const AMBULANCE_POS=[21.5000,39.1925];
const RESPONDER_POS=[21.5065,39.1795];
const RESPONDER_NAME='فيصل السبيعي';
const RESPONDER_LEVEL='مستجيب معتمد CPR/AED';

let theme=localStorage.getItem('responder_theme')||'dark';
function toggleTheme(){theme=theme==='dark'?'light':'dark';localStorage.setItem('responder_theme',theme);applyTheme();}
function applyTheme(){document.documentElement.setAttribute('data-theme',theme);document.getElementById('themeToggle').innerHTML='<svg class="ic"><use href="#'+(theme==='dark'?'i-sun':'i-moon')+'"/></svg>';}

function nowTime(){return new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});}
function toast(msg){const s=document.getElementById('snack');s.textContent=msg;s.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>s.classList.remove('show'),2600);}

function haversine(a,b){
  const R=6371,toRad=d=>d*Math.PI/180;
  const dLat=toRad(b[0]-a[0]),dLon=toRad(b[1]-a[1]);
  const x=Math.sin(dLat/2)**2+Math.cos(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

const ACTIONS=[
  {key:'cpr',icon:'i-heart',label:'بدأت الإنعاش القلبي الرئوي (CPR)',txt:'المستجيب بدأ الإنعاش القلبي الرئوي (CPR)'},
  {key:'aed',icon:'i-bolt',label:'استخدمت جهاز الصدمة الكهربائية (AED)',txt:'المستجيب استخدم جهاز الصدمة الكهربائية (AED)'},
  {key:'ok',icon:'i-check-circle',label:'المصاب استعاد الوعي ويتنفس',txt:'المصاب استعاد الوعي وبدأ يتنفس بشكل ذاتي'}
];

function ensureSeed(){
  if(window.AsafniStore)AsafniStore.seedCase(CASE_ID,{needsResponder:true,responder:null,log:[]});
}

function getShared(){return window.AsafniStore?AsafniStore.getCase(CASE_ID):null;}

function render(){
  const shared=getShared()||{responder:null,log:[]};
  const distToCase=haversine(RESPONDER_POS,CASE.coords);
  const box=document.getElementById('mainArea');

  if(!shared.responder){
    box.innerHTML=`
      <div class="panel">
        <div class="alert-pulse">
          <div class="alert-outer"><span class="alert-ring"></span><span class="alert-ring r2"></span>
            <div class="alert-icon"><svg class="ic"><use href="#i-alert"/></svg></div>
          </div>
          <div class="alert-title">بلاغ طارئ قريب منك</div>
        </div>
        <div class="case-mini">
          <div class="nm">${CASE.name} <span style="color:var(--muted);font-weight:700;font-size:11px">— ${CASE.age} سنة</span></div>
          <div class="sub">على بعد ${distToCase.toFixed(1)} كم منك تقريباً</div>
          <div class="tags">${CASE.conds.map(t=>`<span class="tag"><svg class="ic"><use href="#i-alert"/></svg> ${t}</span>`).join('')}</div>
          <div class="desc">${CASE.desc}</div>
          <div class="mini-fields">
            <div class="mini-field"><span>فصيلة الدم</span><b>${CASE.blood}</b></div>
            <div class="mini-field"><span>الحساسية</span><b style="font-family:var(--font)">${CASE.allergy}</b></div>
            <div class="mini-field"><span>العمر</span><b>${CASE.age}</b></div>
          </div>
          <div class="privacy-note"><svg class="ic"><use href="#i-lock"/></svg><span>لحماية خصوصية المصاب تظهر لك بيانات محدودة فقط — سجله الطبي الكامل يصل تلقائياً للمسعف الرسمي.</span></div>
        </div>
        <button class="btn accept" onclick="acceptAlert()"><svg class="ic"><use href="#i-users"/></svg> قبول والتوجه الآن</button>
      </div>`;
  }else{
    const etaAmb=Math.max(2,Math.round(haversine(AMBULANCE_POS,CASE.coords)/40*60));
    const respLog=(shared.log||[]).slice().reverse();
    box.innerHTML=`
      <div class="panel">
        <h2><span class="bar"></span> أنت في الموقع الآن</h2>
        <div class="case-mini">
          <div class="nm">${CASE.name} <span style="color:var(--muted);font-weight:700;font-size:11px">— ${CASE.age} سنة</span></div>
          <div class="sub">${CASE.desc}</div>
          <div class="mini-fields">
            <div class="mini-field"><span>فصيلة الدم</span><b>${CASE.blood}</b></div>
            <div class="mini-field"><span>الحساسية</span><b style="font-family:var(--font)">${CASE.allergy}</b></div>
            <div class="mini-field"><span>العمر</span><b>${CASE.age}</b></div>
          </div>
        </div>
        <div class="action-list" id="actionList"></div>
        <div class="log-list" id="logList"></div>
        <div class="eta-row">
          <div class="eta-chip"><svg class="ic"><use href="#i-route"/></svg> الإسعاف الرسمي خلال <b>${etaAmb} دقيقة</b></div>
        </div>
      </div>`;
    renderActions(shared);
  }
}

function renderActions(shared){
  const done=new Set((shared.log||[]).map(e=>e.actionKey).filter(Boolean));
  document.getElementById('actionList').innerHTML=ACTIONS.map(a=>`
    <button class="action-btn ${done.has(a.key)?'logged':''}" ${done.has(a.key)?'disabled':''} onclick="logAction('${a.key}')">
      <span class="ic-wrap"><svg class="ic"><use href="#${done.has(a.key)?'i-check-circle':a.icon}"/></svg></span>
      <span>${a.label}${done.has(a.key)?' — تم التدوين':''}</span>
    </button>`).join('');

  const log=(shared.log||[]).slice().reverse();
  document.getElementById('logList').innerHTML=log.length?
    log.map(e=>`<div class="log-item"><span><svg class="ic"><use href="#i-check-circle"/></svg> ${e.txt}</span><span class="lt">${e.t}</span></div>`).join(''):
    '<div class="log-empty">لسا ما سجّلت أي إجراء — استخدمي الأزرار أعلاه فور بدء التدخل.</div>';
}

function acceptAlert(){
  if(!window.AsafniStore){toast('تعذّر الاتصال بالمزامنة المشتركة');return;}
  AsafniStore.patchCase(CASE_ID,{responder:{name:RESPONDER_NAME,level:RESPONDER_LEVEL,acceptedAt:nowTime()}});
  toast('تم قبول البلاغ — لوحة المسعف تعرف الآن إنك في الطريق');
  render();
}

function logAction(key){
  const a=ACTIONS.find(x=>x.key===key);if(!a)return;
  AsafniStore.pushLog(CASE_ID,{t:nowTime(),ts:Date.now(),txt:a.txt,actionKey:a.key,by:'مستجيب'});
  toast('تم إرسال التحديث للوحة المسعف مباشرة');
  render();
}

window.addEventListener('load',()=>{
  applyTheme();
  ensureSeed();
  render();
  if(window.AsafniStore){
    AsafniStore.subscribe(CASE_ID,()=>render());
  }
});
</script>
</body>
</html>
